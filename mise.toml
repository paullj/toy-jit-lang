[tools]
rust = "stable"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-nextest" = "latest"

[tasks.check]
description = "Run all checks"
run = "prek run --all-files --skip lint --skip format"

[tasks.test]
description = "Run the tests"
run = "cargo llvm-cov nextest"

[tasks.lint]
description = "Check lint issues"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.format]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks.bench]
description = "Run benchmarks"
run = "cargo run --release -- bench"

[tasks."bench:criterion"]
description = "Run criterion benchmarks"
run = "cargo bench --package bench"

[tasks."bench:quick"]
description = "Quick benchmark (3 iterations)"
run = "cargo run --release -- bench -n 3"

[tasks."bench:save"]
description = "Save benchmark baseline"
run = "cargo run --release -- bench --save-baseline benchmarks/baseline.json"

[tasks."bench:compare"]
description = "Compare with baseline"
run = "cargo run --release -- bench --baseline benchmarks/baseline.json"

[tasks."run:opt"]
description = "Run with thin LTO optimisations"
run = "cargo run --profile optimised -- run {{arg(i=0)}}"

[tasks."run:max"]
description = "Run with maximum optimisations (fat LTO)"
run = "cargo run --profile optimised-max -- run {{arg(i=0)}}"

[tasks."build:opt"]
description = "Build with thin LTO optimisations"
run = "cargo build --profile optimised"

[tasks."build:max"]
description = "Build with maximum optimisations (fat LTO)"
run = "cargo build --profile optimised-max"

[tasks."bench:opt"]
description = "Run benchmarks with optimised profile"
run = "cargo run --profile optimised -- bench"
