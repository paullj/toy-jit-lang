[package]
name = "bench"
version = "0.1.0"
edition = "2021"

[dependencies]
lex = { path = "../lex" }
parse = { path = "../parse" }
ast = { path = "../ast" }
hir = { path = "../hir" }
infer = { path = "../infer" }
mir = { path = "../mir" }
compile = { path = "../compile" }
vm = { path = "../vm" }
jit = { path = "../jit" }
runtime = { path = "../runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "execution"
harness = false
