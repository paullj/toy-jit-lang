name: benchmark

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Download previous baseline (if exists)
      - name: Download baseline
        uses: actions/cache@v4
        with:
          path: benchmarks/baseline.json
          key: benchmark-${{ github.base_ref || 'dev' }}
          restore-keys: |
            benchmark-dev
            benchmark-main

      # Run benchmarks
      - name: Run benchmarks
        run: |
          cargo build --profile optimised-max
          cargo run --profile optimised-max -- bench -n 10 --save-baseline benchmarks/current.json

      # Compare with baseline (for PRs)
      - name: Compare with baseline
        if: github.event_name == 'pull_request' && hashFiles('benchmarks/baseline.json') != ''
        run: |
          cargo run --profile optimised-max -- bench --baseline benchmarks/baseline.json

      # Run criterion benchmarks
      - name: Criterion benchmarks
        run: cargo bench --profile optimised-max --package bench

      # Upload results
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/current.json
            benchmarks/baseline.json
            target/criterion/

      # Update baseline on main/dev branch pushes
      - name: Update baseline
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
        run: |
          cp benchmarks/current.json benchmarks/baseline.json

      - name: Cache new baseline
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/baseline.json
          key: benchmark-${{ github.ref_name }}

  # Optional: Comment on PR with results
  comment-pr:
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results

      - name: Comment benchmark results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '## Benchmark Results\n\n';

            try {
              const currentData = JSON.parse(fs.readFileSync('benchmarks/current.json'));
              let baselineData = null;
              try {
                baselineData = JSON.parse(fs.readFileSync('benchmarks/baseline.json'));
              } catch (e) {}

              const iterations = currentData.iterations || 10;
              const current = currentData.results || currentData;
              const baseline = baselineData?.results || baselineData;

              let improvements = 0;
              let regressions = 0;
              let highVarianceMetrics = [];

              const formatValue = (avg) => {
                if (avg === undefined || avg === null) return '-';
                if (avg >= 1000) {
                  return `${(avg / 1000).toFixed(1)}ms`;
                }
                return `${avg}µs`;
              };

              const checkVariance = (name, metric, avg, stddev) => {
                if (!avg || !stddev || avg === 0) return;
                const cv = (stddev / avg) * 100; // coefficient of variation
                if (cv > 25) {
                  highVarianceMetrics.push(`${name}/${metric}: ±${cv.toFixed(0)}%`);
                }
              };

              // Helper to get value from baseline (supports old and new format)
              const getBaseValue = (base, newKey, oldKey) => {
                if (!base) return null;
                return base[newKey] ?? base[oldKey] ?? null;
              };

              const formatCell = (currAvg, baseAvg) => {
                const value = formatValue(currAvg);
                if (!baseAvg || baseAvg === 0) return value;

                const diff = ((currAvg - baseAvg) / baseAvg) * 100;
                if (Math.abs(diff) < 5) return value;

                if (diff < -5) {
                  improvements++;
                  return `${value} 🟢↓${Math.abs(diff).toFixed(0)}%`;
                } else {
                  regressions++;
                  return `${value} 🔴↑${diff.toFixed(0)}%`;
                }
              };

              body += `**${iterations} iterations per script**\n\n`;

              // Table 1: Compilation stages
              body += '### Compilation\n\n';
              body += '| Script | lex | parse | hir | infer | **frontend** | mir | compile |\n';
              body += '|--------|-----|-------|-----|-------|--------------|-----|--------|\n';

              for (const [name, data] of Object.entries(current)) {
                const base = baseline?.[name];
                // Check variance for each metric
                checkVariance(name, 'lex', data.lex_avg_us, data.lex_stddev_us);
                checkVariance(name, 'parse', data.parse_avg_us, data.parse_stddev_us);
                checkVariance(name, 'hir', data.hir_avg_us, data.hir_stddev_us);
                checkVariance(name, 'infer', data.infer_avg_us, data.infer_stddev_us);
                checkVariance(name, 'mir', data.mir_avg_us, data.mir_stddev_us);
                checkVariance(name, 'compile', data.compile_avg_us, data.compile_stddev_us);

                // Get baseline values (support old format: _us, new format: _avg_us)
                const baseLex = getBaseValue(base, 'lex_avg_us', 'lex_us');
                const baseParse = getBaseValue(base, 'parse_avg_us', 'parse_us');
                const baseHir = getBaseValue(base, 'hir_avg_us', 'hir_us');
                const baseInfer = getBaseValue(base, 'infer_avg_us', 'infer_us');
                const baseMir = getBaseValue(base, 'mir_avg_us', 'mir_us');
                const baseCompile = getBaseValue(base, 'compile_avg_us', 'compile_us');

                // Calculate frontend total (lex + parse + hir + infer)
                const frontend = (data.lex_avg_us || 0) + (data.parse_avg_us || 0) + (data.hir_avg_us || 0) + (data.infer_avg_us || 0);
                const baseFrontend = (baseLex || 0) + (baseParse || 0) + (baseHir || 0) + (baseInfer || 0) || null;

                body += `| ${name} `;
                body += `| ${formatCell(data.lex_avg_us, baseLex)} `;
                body += `| ${formatCell(data.parse_avg_us, baseParse)} `;
                body += `| ${formatCell(data.hir_avg_us, baseHir)} `;
                body += `| ${formatCell(data.infer_avg_us, baseInfer)} `;
                body += `| **${formatCell(frontend, baseFrontend)}** `;
                body += `| ${formatCell(data.mir_avg_us, baseMir)} `;
                body += `| ${formatCell(data.compile_avg_us, baseCompile)} |\n`;
              }

              // Table 2: Execution
              body += '\n### Execution\n\n';
              body += '| Script | vm_exec | vm_total | jit_compile | jit_exec | jit_total |\n';
              body += '|--------|---------|----------|-------------|----------|----------|\n';

              for (const [name, data] of Object.entries(current)) {
                const base = baseline?.[name];
                // Check variance for execution metrics
                checkVariance(name, 'vm_exec', data.vm_exec_avg_us, data.vm_exec_stddev_us);
                checkVariance(name, 'jit_compile', data.jit_compile_avg_us, data.jit_compile_stddev_us);
                checkVariance(name, 'jit_exec', data.jit_exec_avg_us, data.jit_exec_stddev_us);

                // Get baseline values (support old format: _us, new format: _avg_us)
                const baseVmExec = getBaseValue(base, 'vm_exec_avg_us', 'vm_exec_us');
                const baseVmTotal = getBaseValue(base, 'vm_total_avg_us', 'vm_total_us');
                const baseJitCompile = getBaseValue(base, 'jit_compile_avg_us', 'jit_compile_us');
                const baseJitExec = getBaseValue(base, 'jit_exec_avg_us', 'jit_exec_us');
                const baseJitTotal = getBaseValue(base, 'jit_total_avg_us', 'jit_total_us');

                body += `| ${name} `;
                body += `| ${formatCell(data.vm_exec_avg_us, baseVmExec)} `;
                body += `| ${formatCell(data.vm_total_avg_us, baseVmTotal)} `;
                body += `| ${formatCell(data.jit_compile_avg_us, baseJitCompile)} `;
                body += `| ${formatCell(data.jit_exec_avg_us, baseJitExec)} `;
                body += `| ${formatCell(data.jit_total_avg_us, baseJitTotal)} |\n`;
              }

              // Summary
              body += '\n---\n';
              if (baseline) {
                const totalMetrics = Object.keys(current).length * 10;
                const unchanged = totalMetrics - improvements - regressions;
                body += `**Summary:** ${improvements} improvement${improvements !== 1 ? 's' : ''} 🟢, `;
                body += `${regressions} regression${regressions !== 1 ? 's' : ''} 🔴, `;
                body += `${unchanged} unchanged\n\n`;
                body += `_Compared to baseline from ${context.payload.pull_request?.base?.ref || 'dev'}_\n`;
              } else {
                body += '_No baseline available for comparison_\n';
              }

              // High variance warning
              if (highVarianceMetrics.length > 0) {
                body += `\n⚠️ **High variance** (>25% CV): ${highVarianceMetrics.join(', ')}\n`;
              }
            } catch (e) {
              body += `_Could not parse benchmark results: ${e.message}_\n`;
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
