name: benchmark

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Download previous baseline (if exists)
      - name: Download baseline
        uses: actions/cache@v4
        with:
          path: benchmarks/baseline.json
          key: benchmark-${{ github.base_ref || 'dev' }}
          restore-keys: |
            benchmark-dev
            benchmark-main

      # Run benchmarks (5 warmup + 15 measured iterations)
      - name: Run benchmarks
        run: cargo run --profile optimised-max -- bench -n 15 -w 5 --save-baseline benchmarks/current.json

      # Compare with baseline (for PRs)
      - name: Compare with baseline
        if: github.event_name == 'pull_request' && hashFiles('benchmarks/baseline.json') != ''
        run: |
          cargo run --profile optimised-max -- bench --baseline benchmarks/baseline.json

      # Cross-language benchmarks (indicative only)
      - name: Cross-language benchmarks
        run: |
          mkdir -p benchmarks/cross-lang

          # Go - compile and run 10 times, take median (outputs ms)
          go build -o /tmp/fib_go ./benchmarks/scripts/fib_30.go
          for i in {1..10}; do /tmp/fib_go | tail -1; done | sort -n | sed -n '5p' > benchmarks/cross-lang/go.txt

          # Python - run 10 times, take median (outputs ms)
          for i in {1..10}; do python3 benchmarks/scripts/fib_30.py | tail -1; done | sort -n | sed -n '5p' > benchmarks/cross-lang/python.txt

          # Lua - install and run 10 times, take median (outputs ms)
          sudo apt-get install -y lua5.4
          for i in {1..10}; do lua5.4 benchmarks/scripts/fib_30.lua | tail -1; done | sort -n | sed -n '5p' > benchmarks/cross-lang/lua.txt

          # Extract toy VM and JIT times from current.json (convert µs to ms)
          toy_vm=$(jq -r '(.results.fib_30.vm_exec_avg_us // .fib_30.vm_exec_avg_us) / 1000' benchmarks/current.json)
          toy_jit=$(jq -r '(.results.fib_30.jit_exec_avg_us // .fib_30.jit_exec_avg_us) / 1000' benchmarks/current.json)

          # Create results JSON
          cat <<EOF > benchmarks/cross-lang/results.json
          {
            "go": $(cat benchmarks/cross-lang/go.txt),
            "lua": $(cat benchmarks/cross-lang/lua.txt),
            "python": $(cat benchmarks/cross-lang/python.txt),
            "toy_vm": $toy_vm,
            "toy_jit": $toy_jit
          }
          EOF

      # Upload results
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/current.json
            benchmarks/baseline.json
            benchmarks/cross-lang/results.json

      # Update baseline on main/dev branch pushes
      - name: Update baseline
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
        run: |
          cp benchmarks/current.json benchmarks/baseline.json

      - name: Cache new baseline
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/baseline.json
          key: benchmark-${{ github.ref_name }}

  # Optional: Comment on PR with results
  comment-pr:
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results

      - name: Comment benchmark results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '## Benchmark Results\n\n';

            // Format µs values
            const formatUs = (avg) => {
              if (avg === undefined || avg === null) return '-';
              if (avg >= 1000) return `${(avg / 1000).toFixed(1)}ms`;
              return `${Math.round(avg)}µs`;
            };

            // Format ms values (for cross-lang)
            const formatMs = (avg) => {
              if (avg === undefined || avg === null) return '-';
              return `${avg.toFixed(1)}ms`;
            };

            try {
              const currentData = JSON.parse(fs.readFileSync('current.json'));
              let baselineData = null;
              try {
                baselineData = JSON.parse(fs.readFileSync('baseline.json'));
              } catch (e) {}

              const iterations = currentData.iterations || 15;
              const current = currentData.results || currentData;
              const baseline = baselineData?.results || baselineData;

              let improvements = 0;
              let regressions = 0;
              let unchanged = 0;

              const getBaseValue = (base, newKey, oldKey) => {
                if (!base) return null;
                return base[newKey] ?? base[oldKey] ?? null;
              };

              const formatCell = (currAvg, baseAvg) => {
                const value = formatUs(currAvg);
                if (!baseAvg || baseAvg === 0) return value;

                const diff = ((currAvg - baseAvg) / baseAvg) * 100;
                if (Math.abs(diff) < 10) {
                  unchanged++;
                  return value;
                }

                if (diff < -10) {
                  improvements++;
                  return `${value}<br>🟢↓${Math.abs(diff).toFixed(0)}%`;
                } else {
                  regressions++;
                  return `${value}<br>🔴↑${diff.toFixed(0)}%`;
                }
              };

              body += `**${iterations} iterations per script (5 warmup)**\n\n`;

              // Main summary table: Script | Compilation | VM Exec | JIT Exec | Total
              body += '| Script | Compilation | VM Exec | JIT Exec | Total |\n';
              body += '|--------|-------------|---------|----------|-------|\n';

              for (const [name, data] of Object.entries(current)) {
                const base = baseline?.[name];

                // Compilation = lex + parse + hir + infer + mir + compile
                const compilation = (data.lex_avg_us || 0) + (data.parse_avg_us || 0) +
                  (data.hir_avg_us || 0) + (data.infer_avg_us || 0) +
                  (data.mir_avg_us || 0) + (data.compile_avg_us || 0);
                const baseCompilation = base ?
                  (getBaseValue(base, 'lex_avg_us', 'lex_us') || 0) +
                  (getBaseValue(base, 'parse_avg_us', 'parse_us') || 0) +
                  (getBaseValue(base, 'hir_avg_us', 'hir_us') || 0) +
                  (getBaseValue(base, 'infer_avg_us', 'infer_us') || 0) +
                  (getBaseValue(base, 'mir_avg_us', 'mir_us') || 0) +
                  (getBaseValue(base, 'compile_avg_us', 'compile_us') || 0) : null;

                // VM Execution
                const vmExec = data.vm_exec_avg_us || 0;
                const baseVmExec = base ? (getBaseValue(base, 'vm_exec_avg_us', 'vm_exec_us') || 0) : null;

                // JIT Execution
                const jitExec = data.jit_exec_avg_us || 0;
                const baseJitExec = base ? (getBaseValue(base, 'jit_exec_avg_us', 'jit_exec_us') || 0) : null;

                // Total (prefer JIT)
                const total = data.jit_total_avg_us || data.vm_total_avg_us || 0;
                const baseTotal = base ?
                  (getBaseValue(base, 'jit_total_avg_us', 'jit_total_us') ||
                   getBaseValue(base, 'vm_total_avg_us', 'vm_total_us') || 0) : null;

                body += `| ${name} `;
                body += `| ${formatCell(compilation, baseCompilation)} `;
                body += `| ${formatCell(vmExec, baseVmExec)} `;
                body += `| ${formatCell(jitExec, baseJitExec)} `;
                body += `| ${formatCell(total, baseTotal)} |\n`;
              }

              // Summary
              body += '\n---\n';
              if (baseline) {
                body += `**Summary:** ${improvements} improvement${improvements !== 1 ? 's' : ''} 🟢, `;
                body += `${regressions} regression${regressions !== 1 ? 's' : ''} 🔴, `;
                body += `${unchanged} unchanged\n\n`;
                body += `_Compared to baseline from ${context.payload.pull_request?.base?.ref || 'dev'}_\n`;
              } else {
                body += '_No baseline available for comparison_\n';
              }

              // Detailed compilation (collapsed)
              body += '\n<details>\n<summary>Compilation Details</summary>\n\n';
              body += '| Script | lex | parse | hir | infer | mir | compile |\n';
              body += '|--------|-----|-------|-----|-------|-----|--------|\n';
              for (const [name, data] of Object.entries(current)) {
                const base = baseline?.[name];
                body += `| ${name} `;
                body += `| ${formatUs(data.lex_avg_us)} `;
                body += `| ${formatUs(data.parse_avg_us)} `;
                body += `| ${formatUs(data.hir_avg_us)} `;
                body += `| ${formatUs(data.infer_avg_us)} `;
                body += `| ${formatUs(data.mir_avg_us)} `;
                body += `| ${formatUs(data.compile_avg_us)} |\n`;
              }
              body += '\n</details>\n';

              // Detailed execution (collapsed)
              body += '\n<details>\n<summary>Execution Details</summary>\n\n';
              body += '| Script | vm_exec | vm_total | jit_compile | jit_exec | jit_total |\n';
              body += '|--------|---------|----------|-------------|----------|----------|\n';
              for (const [name, data] of Object.entries(current)) {
                body += `| ${name} `;
                body += `| ${formatUs(data.vm_exec_avg_us)} `;
                body += `| ${formatUs(data.vm_total_avg_us)} `;
                body += `| ${formatUs(data.jit_compile_avg_us)} `;
                body += `| ${formatUs(data.jit_exec_avg_us)} `;
                body += `| ${formatUs(data.jit_total_avg_us)} |\n`;
              }
              body += '\n</details>\n';

            } catch (e) {
              body += `_Could not parse benchmark results: ${e.message}_\n`;
            }

            // Cross-language comparison (collapsed)
            try {
              const crossLang = JSON.parse(fs.readFileSync('cross-lang/results.json'));
              body += '\n<details>\n<summary><b>Cross-Language Comparison (fib_30)</b></summary>\n\n';
              body += '> [!WARNING]\n';
              body += '> Indicative only. Not suitable for direct performance comparisons.\n\n';
              body += '| Language | Exec Time |\n';
              body += '|----------|----------|\n';
              body += `| Go | ${formatMs(crossLang.go)} |\n`;
              body += `| Lua | ${formatMs(crossLang.lua)} |\n`;
              body += `| Python | ${formatMs(crossLang.python)} |\n`;
              body += `| **Toy VM** | ${formatMs(crossLang.toy_vm)} |\n`;
              body += `| **Toy JIT** | ${formatMs(crossLang.toy_jit)} |\n`;
              body += '\n</details>\n';
            } catch (e) {
              // Cross-language results not available
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
