name: benchmark

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Download previous baseline (if exists)
      - name: Download baseline
        uses: actions/cache@v4
        with:
          path: benchmarks/baseline.json
          key: benchmark-${{ github.base_ref || 'dev' }}
          restore-keys: |
            benchmark-dev
            benchmark-main

      # Run benchmarks
      - name: Run benchmarks
        run: |
          cargo build --release
          cargo run --release -- bench -n 10 --save-baseline benchmarks/current.json

      # Compare with baseline (for PRs)
      - name: Compare with baseline
        if: github.event_name == 'pull_request' && hashFiles('benchmarks/baseline.json') != ''
        run: |
          cargo run --release -- bench --baseline benchmarks/baseline.json

      # Run criterion benchmarks
      - name: Criterion benchmarks
        run: cargo bench --package bench

      # Upload results
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/current.json
            benchmarks/baseline.json
            target/criterion/

      # Update baseline on main/dev branch pushes
      - name: Update baseline
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
        run: |
          cp benchmarks/current.json benchmarks/baseline.json

      - name: Cache new baseline
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/baseline.json
          key: benchmark-${{ github.ref_name }}

  # Optional: Comment on PR with results
  comment-pr:
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results

      - name: Comment benchmark results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '## Benchmark Results\n\n';

            try {
              const currentData = JSON.parse(fs.readFileSync('benchmarks/current.json'));
              let baselineData = null;
              try {
                baselineData = JSON.parse(fs.readFileSync('benchmarks/baseline.json'));
              } catch (e) {}

              const iterations = currentData.iterations || 10;
              const current = currentData.results || currentData;
              const baseline = baselineData?.results || baselineData;

              let improvements = 0;
              let regressions = 0;

              const formatValue = (avg, stddev) => {
                if (avg === undefined || avg === null) return '-';
                const sd = stddev || 0;
                if (avg >= 1000) {
                  return `${(avg / 1000).toFixed(1)}±${(sd / 1000).toFixed(1)}ms`;
                }
                return `${avg}±${sd}µs`;
              };

              const formatCell = (currAvg, currStddev, baseAvg) => {
                const value = formatValue(currAvg, currStddev);
                if (!baseAvg || baseAvg === 0) return value;

                const diff = ((currAvg - baseAvg) / baseAvg) * 100;
                if (Math.abs(diff) < 5) return value;

                if (diff < -5) {
                  improvements++;
                  return `${value} 🟢↓${Math.abs(diff).toFixed(0)}%`;
                } else {
                  regressions++;
                  return `${value} 🔴↑${diff.toFixed(0)}%`;
                }
              };

              body += `**${iterations} iterations per script**\n\n`;

              // Table 1: Compilation stages
              body += '### Compilation\n\n';
              body += '| Script | lex | parse | hir | infer | mir | compile |\n';
              body += '|--------|-----|-------|-----|-------|-----|--------|\n';

              for (const [name, data] of Object.entries(current)) {
                const base = baseline?.[name];
                body += `| ${name} `;
                body += `| ${formatCell(data.lex_avg_us, data.lex_stddev_us, base?.lex_avg_us)} `;
                body += `| ${formatCell(data.parse_avg_us, data.parse_stddev_us, base?.parse_avg_us)} `;
                body += `| ${formatCell(data.hir_avg_us, data.hir_stddev_us, base?.hir_avg_us)} `;
                body += `| ${formatCell(data.infer_avg_us, data.infer_stddev_us, base?.infer_avg_us)} `;
                body += `| ${formatCell(data.mir_avg_us, data.mir_stddev_us, base?.mir_avg_us)} `;
                body += `| ${formatCell(data.compile_avg_us, data.compile_stddev_us, base?.compile_avg_us)} |\n`;
              }

              // Table 2: Execution
              body += '\n### Execution\n\n';
              body += '| Script | vm_exec | vm_total | jit_compile | jit_exec | jit_total |\n';
              body += '|--------|---------|----------|-------------|----------|----------|\n';

              for (const [name, data] of Object.entries(current)) {
                const base = baseline?.[name];
                body += `| ${name} `;
                body += `| ${formatCell(data.vm_exec_avg_us, data.vm_exec_stddev_us, base?.vm_exec_avg_us)} `;
                body += `| ${formatCell(data.vm_total_avg_us, null, base?.vm_total_avg_us)} `;
                body += `| ${formatCell(data.jit_compile_avg_us, data.jit_compile_stddev_us, base?.jit_compile_avg_us)} `;
                body += `| ${formatCell(data.jit_exec_avg_us, data.jit_exec_stddev_us, base?.jit_exec_avg_us)} `;
                body += `| ${formatCell(data.jit_total_avg_us, null, base?.jit_total_avg_us)} |\n`;
              }

              // Summary
              body += '\n---\n';
              if (baseline) {
                const unchanged = Object.keys(current).length * 10 - improvements - regressions;
                body += `**Summary:** ${improvements} improvement${improvements !== 1 ? 's' : ''} 🟢, `;
                body += `${regressions} regression${regressions !== 1 ? 's' : ''} 🔴, `;
                body += `${unchanged} unchanged\n\n`;
                body += `_Compared to baseline from ${context.payload.pull_request?.base?.ref || 'dev'}_\n`;
              } else {
                body += '_No baseline available for comparison_\n';
              }
            } catch (e) {
              body += `_Could not parse benchmark results: ${e.message}_\n`;
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
